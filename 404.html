<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Starlink Surcharge Map — tjhansen.net</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.
      
      // If path starts with /starlink-surcharge-map or /StarlinkSurchargeMap,
      // redirect directly to the dedicated subpage.
      var p = window.location.pathname;
      if (p.toLowerCase().indexOf('/starlinksurchargemap') !== -1 || p.toLowerCase().indexOf('/starlink-surcharge-map') !== -1) {
        window.location.replace('/starlink-surcharge-map/' + window.location.search + window.location.hash);
      } else {
        // Standard SPA redirect for tjhansen.net (custom domain = 0 path segments to keep)
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/starlink-surcharge-map">Starlink High-Demand Surcharge Map</a>...</p>
  </body>
</html>
