name: Starlink Adaptive Surcharge Sampler

on:
  schedule:
    # Runs hourly at minute 17 to stay within free tier and spread sampling evenly
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of blanket hex coordinates to probe'
        required: false
        default: '8'
      hotspots_only:
        description: 'Only probe known hotspots list (true/false)'
        required: false
        default: 'false'
      dry_run:
        description: 'Perform dry run without database writes (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sample-demand:
    name: Probe Adaptive US Surcharge Lattice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Surcharge Sampling Batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.hotspots_only }}" = "true" ]; then
            FLAGS="$FLAGS --hotspots-only"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          BATCH_SIZE="${{ github.event.inputs.batch_size || '8' }}"
          python scripts/sample_demand.py --batch-size "$BATCH_SIZE" $FLAGS

      - name: Persist Sampling State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/sampling_state.json
          git diff-index --quiet HEAD || git commit -m "chore(telemetry): update sampling cursor & hotspots state [skip ci]"
          git push origin HEAD || echo "Push skipped or no new state changes"
