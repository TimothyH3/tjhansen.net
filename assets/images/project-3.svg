<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="50%" stop-color="#1B1A3A"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg3)"/>
  
  <rect x="50" y="45" width="700" height="390" rx="12" fill="#111222" stroke="rgba(255,255,255,0.08)"/>
  <rect x="50" y="45" width="700" height="42" rx="12" fill="#181830" stroke="rgba(255,255,255,0.05)"/>
  <circle cx="78" cy="66" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="96" cy="66" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="114" cy="66" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="71" fill="#A5B4FC" font-family="monospace" font-size="11" text-anchor="middle">collab-sync-engine // crdt-state-vector-room-04</text>

  <!-- Collaborative Canvas with multi-user cursors -->
  <g transform="translate(60, 95)">
    <!-- Canvas Grid Dots -->
    <g fill="rgba(255,255,255,0.12)">
      <circle cx="50" cy="50" r="1.5"/><circle cx="120" cy="50" r="1.5"/><circle cx="190" cy="50" r="1.5"/><circle cx="260" cy="50" r="1.5"/><circle cx="330" cy="50" r="1.5"/><circle cx="400" cy="50" r="1.5"/><circle cx="470" cy="50" r="1.5"/><circle cx="540" cy="50" r="1.5"/><circle cx="610" cy="50" r="1.5"/>
      <circle cx="50" cy="110" r="1.5"/><circle cx="120" cy="110" r="1.5"/><circle cx="190" cy="110" r="1.5"/><circle cx="260" cy="110" r="1.5"/><circle cx="330" cy="110" r="1.5"/><circle cx="400" cy="110" r="1.5"/><circle cx="470" cy="110" r="1.5"/><circle cx="540" cy="110" r="1.5"/><circle cx="610" cy="110" r="1.5"/>
      <circle cx="50" cy="170" r="1.5"/><circle cx="120" cy="170" r="1.5"/><circle cx="190" cy="170" r="1.5"/><circle cx="260" cy="170" r="1.5"/><circle cx="330" cy="170" r="1.5"/><circle cx="400" cy="170" r="1.5"/><circle cx="470" cy="170" r="1.5"/><circle cx="540" cy="170" r="1.5"/><circle cx="610" cy="170" r="1.5"/>
      <circle cx="50" cy="230" r="1.5"/><circle cx="120" cy="230" r="1.5"/><circle cx="190" cy="230" r="1.5"/><circle cx="260" cy="230" r="1.5"/><circle cx="330" cy="230" r="1.5"/><circle cx="400" cy="230" r="1.5"/><circle cx="470" cy="230" r="1.5"/><circle cx="540" cy="230" r="1.5"/><circle cx="610" cy="230" r="1.5"/>
    </g>

    <!-- Synced Objects -->
    <rect x="140" y="70" width="160" height="120" rx="10" fill="#201F48" stroke="#818CF8" stroke-width="2"/>
    <text x="220" y="125" fill="#EEF2FF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Auth Context Node</text>
    <text x="220" y="145" fill="#A5B4FC" font-family="monospace" font-size="10" text-anchor="middle">Sync Hash: #8F3B</text>

    <rect x="380" y="110" width="170" height="110" rx="10" fill="#1C273E" stroke="#38BDF8" stroke-width="2"/>
    <text x="465" y="160" fill="#F0F9FF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Data Store Cluster</text>
    <text x="465" y="180" fill="#7DD3FC" font-family="monospace" font-size="10" text-anchor="middle">WebSocket / binary frames</text>

    <!-- Connector -->
    <path d="M300 130 C 340 130, 340 160, 380 160" stroke="#F43F5E" stroke-width="2" stroke-dasharray="5 3"/>

    <!-- User 1 Cursor -->
    <g transform="translate(180, 50)">
      <polygon points="0,0 4,14 8,10 14,14 16,11 10,7 16,5" fill="#F43F5E"/>
      <rect x="14" y="12" width="70" height="20" rx="4" fill="#F43F5E"/>
      <text x="49" y="26" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Alex (Host)</text>
    </g>

    <!-- User 2 Cursor -->
    <g transform="translate(490, 80)">
      <polygon points="0,0 4,14 8,10 14,14 16,11 10,7 16,5" fill="#10B981"/>
      <rect x="14" y="12" width="80" height="20" rx="4" fill="#10B981"/>
      <text x="54" y="26" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Timothy (Dev)</text>
    </g>
  </g>
</svg>

