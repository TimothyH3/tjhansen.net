<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg2)"/>
  
  <!-- App Window -->
  <rect x="50" y="45" width="700" height="390" rx="12" fill="#0B1120" stroke="rgba(255,255,255,0.08)"/>
  <!-- Top bar -->
  <rect x="50" y="45" width="700" height="42" rx="12" fill="#131D31" stroke="rgba(255,255,255,0.05)"/>
  <circle cx="78" cy="66" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="96" cy="66" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="114" cy="66" r="5" fill="#10B981" opacity="0.8"/>
  <rect x="250" y="55" width="300" height="22" rx="6" fill="#0B1120" stroke="rgba(255,255,255,0.05)"/>
  <text x="400" y="70" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">https://cloud-canvas.app/dashboard</text>

  <!-- Left Sidebar -->
  <rect x="50" y="87" width="150" height="348" fill="#0F172A" stroke="rgba(255,255,255,0.05)"/>
  <rect x="70" y="115" width="110" height="12" rx="4" fill="#38BDF8" opacity="0.7"/>
  <rect x="70" y="145" width="85" height="10" rx="3" fill="#334155"/>
  <rect x="70" y="170" width="100" height="10" rx="3" fill="#334155"/>
  <rect x="70" y="195" width="70" height="10" rx="3" fill="#334155"/>
  <rect x="70" y="220" width="95" height="10" rx="3" fill="#334155"/>

  <!-- Main Canvas Area -->
  <rect x="225" y="115" width="150" height="90" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="245" y="145" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">Active Services</text>
  <text x="245" y="180" fill="#38BDF8" font-family="sans-serif" font-size="24" font-weight="700">99.98%</text>

  <rect x="395" y="115" width="150" height="90" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
  <text x="415" y="145" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">Avg Latency</text>
  <text x="415" y="180" fill="#10B981" font-family="sans-serif" font-size="24" font-weight="700">24ms</text>

  <rect x="565" y="115" width="160" height="90" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
  <text x="585" y="145" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">Total Requests</text>
  <text x="585" y="180" fill="#A855F7" font-family="sans-serif" font-size="24" font-weight="700">4.8M</text>

  <!-- Big Data Visualization panel -->
  <rect x="225" y="225" width="500" height="185" rx="8" fill="#131D31" stroke="rgba(255,255,255,0.06)"/>
  <text x="245" y="255" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">System Telemetry &amp; Event Log</text>
  
  <!-- Line chart simulation -->
  <polyline points="245,360 300,340 350,350 400,310 450,330 500,290 550,305 600,270 650,295 700,265" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="500" cy="290" r="4" fill="#38BDF8"/>
  <circle cx="600" cy="270" r="4" fill="#38BDF8"/>
  <circle cx="700" cy="265" r="4" fill="#38BDF8"/>
</svg>

