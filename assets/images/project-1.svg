<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="480" fill="url(#bg1)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
  </g>

  <!-- Window Header -->
  <rect x="60" y="50" width="680" height="40" rx="10" fill="#151E33" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="86" cy="70" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="104" cy="70" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="122" cy="70" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="75" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">api-cluster // metrics-throughput [healthy]</text>

  <!-- Architecture / Flow Nodes -->
  <g transform="translate(60, 90)">
    <rect width="680" height="330" rx="0" fill="#0D1627" stroke="rgba(255,255,255,0.06)"/>
    
    <!-- Node 1: Producer -->
    <rect x="40" y="115" width="130" height="80" rx="8" fill="#15203B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="105" y="150" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">Producer API</text>
    <text x="105" y="170" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">12.4k req/sec</text>

    <!-- Connector 1 -->
    <path d="M170 155 L250 155" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="252,155 244,150 244,160" fill="#818CF8"/>

    <!-- Node 2: Message Broker / Queue -->
    <rect x="250" y="100" width="160" height="110" rx="10" fill="#182344" stroke="#818CF8" stroke-width="1.5" filter="url(#glow1)"/>
    <text x="330" y="140" fill="#F8FAFC" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">Kafka / Redis</text>
    <text x="330" y="162" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Partitioned Stream</text>
    <rect x="270" y="178" width="120" height="12" rx="6" fill="#0E172B"/>
    <rect x="270" y="178" width="94" height="12" rx="6" fill="#10B981"/>

    <!-- Connector 2 -->
    <path d="M410 155 L490 155" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="492,155 484,150 484,160" fill="#38BDF8"/>

    <!-- Node 3: Workers -->
    <rect x="490" y="60" width="140" height="70" rx="8" fill="#15203B" stroke="rgba(255,255,255,0.2)"/>
    <text x="560" y="95" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Worker Pod Alpha</text>
    <text x="560" y="115" fill="#10B981" font-family="monospace" font-size="10" text-anchor="middle">p99 &lt; 14ms</text>

    <rect x="490" y="150" width="140" height="70" rx="8" fill="#15203B" stroke="rgba(255,255,255,0.2)"/>
    <text x="560" y="185" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Worker Pod Beta</text>
    <text x="560" y="205" fill="#10B981" font-family="monospace" font-size="10" text-anchor="middle">p99 &lt; 16ms</text>

    <!-- Graph line along the bottom -->
    <path d="M 50 290 Q 150 250, 250 270 T 450 240 T 630 260" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.8"/>
    <path d="M 50 290 Q 150 250, 250 270 T 450 240 T 630 260 L 630 310 L 50 310 Z" fill="url(#lineGrad)" opacity="0.1"/>
  </g>
</svg>

