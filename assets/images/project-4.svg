<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140E1B"/>
      <stop offset="50%" stop-color="#231326"/>
      <stop offset="100%" stop-color="#0B0910"/>
    </linearGradient>
    <linearGradient id="asuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C1D40"/>
      <stop offset="100%" stop-color="#FFC627"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg4)"/>
  
  <rect x="50" y="45" width="700" height="390" rx="12" fill="#130D19" stroke="rgba(255,255,255,0.08)"/>
  <rect x="50" y="45" width="700" height="42" rx="12" fill="#1E1426" stroke="rgba(255,255,255,0.05)"/>
  <circle cx="78" cy="66" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="96" cy="66" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="114" cy="66" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="71" fill="#E9D5FF" font-family="monospace" font-size="11" text-anchor="middle">asu-capstone // autonomous-edge-telemetry-ai</text>

  <g transform="translate(70, 110)">
    <!-- ASU badge accent subtle -->
    <rect x="0" y="0" width="180" height="28" rx="6" fill="#8C1D40" opacity="0.25" stroke="#8C1D40" stroke-width="1"/>
    <text x="90" y="19" fill="#FFC627" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ASU SENIOR CAPSTONE</text>

    <!-- Radar / Sensor / AI Visual -->
    <circle cx="510" cy="150" r="110" fill="none" stroke="rgba(255,198,39,0.15)" stroke-width="1.5"/>
    <circle cx="510" cy="150" r="75" fill="none" stroke="rgba(255,198,39,0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="510" cy="150" r="40" fill="none" stroke="rgba(255,198,39,0.4)" stroke-width="1.5"/>
    <circle cx="510" cy="150" r="5" fill="#FFC627"/>
    <line x1="510" y1="40" x2="510" y2="260" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="400" y1="150" x2="620" y2="150" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <polygon points="510,150 590,110 570,165" fill="rgba(255,198,39,0.2)"/>

    <!-- Left side telemetry data -->
    <rect x="0" y="50" width="310" height="70" rx="8" fill="#1D1525" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="78" fill="#F3E8FF" font-family="monospace" font-size="12" font-weight="600">Model Inference Rate</text>
    <text x="20" y="104" fill="#34D399" font-family="monospace" font-size="18" font-weight="700">120 FPS // 4.2ms avg</text>

    <rect x="0" y="135" width="310" height="70" rx="8" fill="#1D1525" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="163" fill="#F3E8FF" font-family="monospace" font-size="12" font-weight="600">Resource Footprint</text>
    <text x="20" y="189" fill="#38BDF8" font-family="monospace" font-size="18" font-weight="700">18.4 MB (Embedded C++)</text>

    <rect x="0" y="220" width="310" height="60" rx="8" fill="#1D1525" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="246" fill="#F3E8FF" font-family="monospace" font-size="12" font-weight="600">Deployment Status</text>
    <text x="20" y="268" fill="#FBBF24" font-family="monospace" font-size="13">Edge Hardware Active (IoT Mesh)</text>
  </g>
</svg>

